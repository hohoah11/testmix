<style>

#rd-illusion .rd-picture img{display:block!important;width:100%!important;max-width:100%!important;height:auto!important;aspect-ratio:1/1;object-fit:contain;border:0!important;border-radius:0!important;margin:0!important;padding:0!important;box-shadow:none!important}

#rd-illusion h2{margin:0 0 9px;color:#fff5dc;font-size:25px;font-weight:800;line-height:1.4;text-align:center}
#rd-illusion h3{margin:0 0 8px;color:#f7dc9b;font-size:18px;font-weight:750;line-height:1.5}

#rd-illusion .rd-intro{text-align:center}

#rd-illusion button{appearance:none;display:flex;align-items:center;justify-content:center;gap:7px;width:100%;min-width:0;min-height:56px;margin:0;padding:13px 9px;border:1px solid #647488;border-radius:13px;background:#20344b;color:#fff;font:inherit;font-size:17px;font-weight:750;line-height:1.4;letter-spacing:normal;text-transform:none;text-decoration:none;white-space:normal;word-break:keep-all;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;box-shadow:none;transition:background .15s,transform .15s}
#rd-illusion button[data-choice="rabbit"]{background:#f1d9a5;color:#17293d;border-color:#f1d9a5}
#rd-illusion button:active{transform:scale(.98)}
#rd-illusion button:focus-visible,#rd-illusion a:focus-visible{outline:3px solid #fff1bd;outline-offset:3px}
#rd-illusion button:disabled{opacity:.55;cursor:default}
#rd-illusion .rd-result-heading{margin-bottom:19px}
#rd-illusion .rd-copy{margin-top:19px}

<script>
(function () {
  "use strict";

  var root = document.getElementById("rd-illusion");

  if (!root || root.dataset.ready) {
    return;
  }

  root.dataset.ready = "true";

  function get(name) {
    return root.querySelector('[data-rd="' + name + '"]');
  }

  function decodeText(value) {
    var box = document.createElement("textarea");
    box.innerHTML = String(value == null ? "" : value);
    return box.value;
  }

  function setText(element, value) {
    if (!element) return;
    element.textContent = decodeText(value);
  }

  var picture = get("image");
  var original = picture.getAttribute("src");
  var originalAlt = picture.alt;
  var current = null;

  var data = {
    rabbit: {
      image: "https://blogger.googleusercontent.com/img/a/AVvXsEhP9PYcEz1d19zqv5z6jOHxpBog9fPFvk1YPOZuNuD9jWKEq25J3C0nSpV777IhZAKzgnDkXawmtxKSqGEcnAiMarV-VRoNWYdBhY7oknSQStRDLbd1KvZAA-DZBeUNTNGiWuTu4DTKIuvZKqf177Ss1RixJollbEbLDqKjmN0qhuwsvQ_1MVjnhOiN3UsF",

      alt: "왼쪽으로 뻗은 두 귀와 오른쪽을 향한 얼굴이 강조된 토끼 해설 이미지",

      title: "토끼가 먼저 보였군요!",

      reasonTitle: "토끼로 보이는 이유",

      reason: "왼쪽으로 길게 갈라진 부분을 토끼의 두 귀로 받아들였기 때문이에요. 그러면 오른쪽의 둥근 윤곽은 이마와 코가 되고, 검은 점은 눈으로 연결되면서 오른쪽을 바라보는 토끼가 완성돼요. 같은 선도 어떤 신체 부위로 해석하느냐에 따라 전혀 다른 동물로 보일 수 있답니다.",

      character: "상상을 즐기는 토끼",

      personality: "이번 선택에 재미로 붙여 본 캐릭터는 익숙한 장면에서도 새로운 이야기를 발견하는 토끼예요. 하나의 답에 머무르기보다 '이렇게 보면 어떨까?' 하고 다른 가능성을 떠올리는 모습이 어울려요. 평소의 나와 닮았나요? 떠오른 생각을 작은 행동으로 옮겨 보면 더 재미있는 하루가 될 거예요.",

      tip: "원본으로 돌아가 긴 두 귀를 살짝 벌어진 오리의 부리라고 생각해 보세요. 이번에는 왼쪽을 바라보는 오리가 나타날지도 몰라요.",

      other: "오리 해설 보기"
    },

    duck: {
      image: "https://blogger.googleusercontent.com/img/a/AVvXsEg_zeeoIPtudU3DNkLSJdgKcCE4y9ZYQkD3zCaasxpajHFNMOkDWct-TE4_jbvKy53JN89xO9Nb7qtw2_RL5dfcgC04ENSqNnt3R_0k5Li6O2AzmmEsYgx1344-qMbcCdm_QyzigTvOGPbczWF68aajb6_9GtgnDB7X3_ioafKcTfUXhs0s4kwWyprwRMLS",

      alt: "왼쪽으로 벌어진 노란 부리가 강조된 오리 해설 이미지",

      title: "오리가 먼저 보였군요!",

      reasonTitle: "오리로 보이는 이유",

      reason: "왼쪽으로 길게 벌어진 부분을 오리의 부리로 받아들였기 때문이에요. 그 옆의 검은 점을 눈으로, 오른쪽의 둥근 윤곽을 머리 뒤쪽으로 연결하면 왼쪽을 바라보는 오리가 완성돼요. 토끼로 볼 때는 귀였던 부분이 오리로 볼 때는 부리가 되는 것이 이 착시의 재미랍니다.",

      character: "단서를 찾는 오리",

      personality: "이번 선택에 재미로 붙여 본 캐릭터는 눈에 들어온 특징을 연결하며 상황을 살펴보는 오리예요. 막연하게 넘기기보다 '어떤 단서가 있을까?' 하고 차근차근 확인하는 모습이 어울려요. 평소의 나와 닮았나요? 익숙한 답을 찾은 뒤 다른 가능성도 한 번 떠올려 보면 새로운 재미가 생길 거예요.",

      tip: "원본으로 돌아가 벌어진 부리를 뒤로 길게 뻗은 토끼의 두 귀라고 생각해 보세요. 이번에는 오른쪽을 바라보는 토끼가 나타날지도 몰라요.",

      other: "토끼 해설 보기"
    }
  };

  function changeImage(src, alt) {
    get("error").hidden = true;
    picture.alt = decodeText(alt);
    get("image-link").href = src;
    picture.src = src;
  }

  picture.addEventListener("error", function () {
    get("error").hidden = false;
  });

  picture.addEventListener("load", function () {
    get("error").hidden = true;
  });

  get("image-link").href = original;

  if (picture.complete && !picture.naturalWidth) {
    get("error").hidden = false;
  }

  function moveToStart(heading) {
    heading.focus({ preventScroll: true });

    var rect = root.getBoundingClientRect();

    if (rect.top < 0 || rect.top > window.innerHeight * 0.35) {
      var reduced = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

      root.scrollIntoView({
        behavior: reduced ? "auto" : "smooth",
        block: "start"
      });
    }
  }

  function showResult(key, comparing) {
    var item = data[key];
    if (!item) return;

    current = key;
    changeImage(item.image, item.alt);

    setText(
      get("title"),
      comparing
        ? (
            key === "rabbit"
              ? "토끼로 보면 이런 모습이에요"
              : "오리로 보면 이런 모습이에요"
          )
        : item.title
    );

    setText(get("reason-title"), item.reasonTitle);
    setText(get("reason"), item.reason);
    setText(get("character"), item.character);
    setText(get("personality"), item.personality);
    setText(get("tip"), item.tip);
    setText(get("other"), item.other);

    get("question").hidden = true;
    get("result").hidden = false;

    moveToStart(get("title"));
  }

  root.querySelectorAll("[data-choice]").forEach(function (button) {
    button.disabled = false;

    button.addEventListener("click", function () {
      showResult(button.dataset.choice, false);
    });
  });

  get("restart").addEventListener("click", function () {
    changeImage(original, originalAlt);
    current = null;

    get("result").hidden = true;
    get("question").hidden = false;

    moveToStart(get("question-title"));
  });

  get("other").addEventListener("click", function () {
    showResult(
      current === "rabbit" ? "duck" : "rabbit",
      true
    );
  });

  var preloadImages = [];

  function preload() {
    Object.keys(data).forEach(function (key) {
      var cached = new Image();
      cached.src = data[key].image;
      preloadImages.push(cached);
    });
  }

  if (picture.complete) {
    preload();
  } else {
    picture.addEventListener("load", preload, { once: true });
  }
})();
</script>
