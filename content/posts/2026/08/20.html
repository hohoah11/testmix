<!-- 그녀는 나를 좋아할까? / Blogger 본문용 -->
<div id="love-signal-test">
  <div class="lst-shell">
    <button class="lst-sound" id="lst-sound" type="button" aria-pressed="true">SOUND ON</button>

    <section class="lst-screen is-active lst-start" id="lst-start">
      <img class="lst-full-image" src="https://blogger.googleusercontent.com/img/a/AVvXsEhy_g_EEpYyrolAJ5a1m-sofXbfa3BPn874OEXHXFuHDq7dKgm5d2YKfAtM8PuupA4rvwafraGta1TwP3JorKgvJW4AU9gjAdd5fh5ILSYbZaU7t21lFhryzAzx1_2iCFILKfeexGysifSe9piNNTZVabjPX7HCcrX0eEqOvKvlPIeZLfDVO2H9uUejNd-6" alt="카페에서 나를 바라보는 여성" loading="eager">
      <div class="lst-vignette"></div>
      <div class="lst-start-copy">
        <span class="lst-eyebrow">RELATIONSHIP SIGNAL TEST</span>
        <h2>그녀는<br><em>나를 좋아할까?</em></h2>
        <p>스쳐 지나간 말과 행동 속에서<br>반복되는 호감 신호를 확인해 보세요.</p>
        <div class="lst-meta"><span>20가지 상황</span><span>10개 장면</span><span>약 4분</span></div>
        <button class="lst-primary" id="lst-start-btn" type="button">그녀의 신호 확인하기</button>
        <small>한두 장면보다 반복되는 행동을 떠올려 답해 주세요.</small>
      </div>
    </section>

    <section class="lst-screen lst-quiz" id="lst-quiz" aria-live="polite">
      <div class="lst-photo" id="lst-photo"></div>
      <div class="lst-photo-shade"></div>
      <div class="lst-quiz-top">
        <button class="lst-back" id="lst-back" type="button">BACK</button>
        <div class="lst-progress-copy"><span id="lst-scene-count">SCENE 01 / 10</span><b><span id="lst-now">1</span> / 20</b></div>
        <div class="lst-progress"><i id="lst-progress-bar"></i></div>
      </div>
      <div class="lst-question-card">
        <span class="lst-place" id="lst-place"></span>
        <h3 id="lst-question"></h3>
        <div class="lst-options" id="lst-options"></div>
      </div>
    </section>

    <section class="lst-screen lst-loading" id="lst-loading" aria-live="assertive">
      <div class="lst-scan-line"></div>
      <span class="lst-eyebrow">READING THE SIGNALS</span>
      <h2>그녀의 말과 행동을<br>다시 맞춰 보는 중</h2>
      <p id="lst-loading-copy">당신에게만 보인 행동인지 확인하고 있어요.</p>
      <div class="lst-loading-bar"><i id="lst-loading-bar"></i></div>
    </section>

    <section class="lst-screen lst-result" id="lst-result" aria-live="polite">
      <div class="lst-photo" id="lst-result-photo"></div>
      <div class="lst-photo-shade lst-result-shade"></div>
      <div class="lst-result-panel">
        <span class="lst-eyebrow" id="lst-result-kicker"></span>
        <h2 id="lst-result-title"></h2>
        <p class="lst-result-lead" id="lst-result-lead"></p>
        <div class="lst-meter"><div><span>호감 신호 일치도</span><b id="lst-score-label"></b></div><i><em id="lst-score-bar"></em></i></div>
        <div class="lst-result-copy">
          <article><span>이렇게 해석했어요</span><p id="lst-why"></p></article>
          <article><span>다음 행동은</span><p id="lst-next"></p></article>
          <article><span>꼭 기억할 점</span><p id="lst-remember"></p></article>
        </div>
        <div class="lst-actions"><button class="lst-primary" id="lst-share" type="button">친구도 함께 해보기</button><button class="lst-secondary" id="lst-retry" type="button">다시 테스트</button></div>

        <small>상대의 마음은 테스트만으로 단정할 수 없습니다. 관계와 상황을 함께 살펴보세요.</small>
      </div>
    </section>
  </div>
</div>
