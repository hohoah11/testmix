<div id="yf-test">
  <style>
    #yf-test { --ink:#17233d; --navy:#17345c; --red:#e6533f; --cream:#f7eedf; --paper:#fffaf1; --gold:#e9b949; width:100%; max-width:760px; margin:0 auto; color:var(--ink); font-family:"Pretendard","Noto Sans KR",Arial,sans-serif; line-height:1.55; box-sizing:border-box; }
    #yf-test * { box-sizing:border-box; }
    #yf-test button { font:inherit; }
    #yf-test .yf-shell { position:relative; overflow:hidden; min-height:680px; padding:20px 18px 130px; border:3px solid var(--ink); background:var(--cream); box-shadow:10px 10px 0 var(--ink); }
    #yf-test .yf-shell:before { content:""; position:absolute; inset:0; pointer-events:none; opacity:.17; background-image:linear-gradient(90deg,transparent 49%,rgba(23,35,61,.12) 50%,transparent 51%),linear-gradient(transparent 49%,rgba(23,35,61,.08) 50%,transparent 51%); background-size:34px 34px; }
    #yf-test .yf-screen { position:relative; z-index:1; display:none; animation:yfIn .35s ease both; }
    #yf-test .yf-screen.is-active { display:block; }
    #yf-test .yf-kicker { display:inline-block; margin:0 0 12px; padding:5px 11px; border:2px solid var(--ink); background:var(--gold); color:var(--ink) !important; font-size:13px; font-weight:900; letter-spacing:.04em; transform:rotate(-1deg); }
    #yf-test h1,#yf-test h2,#yf-test h3,#yf-test p { color:var(--ink); }
    #yf-test h1 { margin:0; font-size:clamp(34px,8vw,62px); line-height:1.03; letter-spacing:-.055em; font-weight:1000; word-break:keep-all; }
    #yf-test h1 span { color:var(--red); }
    #yf-test .yf-lead { margin:16px 0 20px; font-size:16px; font-weight:700; word-break:keep-all; }
    #yf-test .yf-square { width:100%; aspect-ratio:1 / 1; overflow:hidden; border:3px solid var(--ink); background:#eadcc9; box-shadow:6px 6px 0 var(--red); }
    #yf-test .yf-square img { display:block; width:100%; height:100%; object-fit:contain; }
    #yf-test .yf-note { margin:20px 0 0; padding:14px 15px; border-left:6px solid var(--red); background:rgba(255,255,255,.68); font-size:14px; font-weight:700; word-break:keep-all; }
    #yf-test .yf-primary,#yf-test .yf-secondary,#yf-test .yf-answer { width:100%; min-height:54px; border:3px solid var(--ink); cursor:pointer; transition:transform .12s ease,box-shadow .12s ease,background .12s ease; }
    #yf-test .yf-primary { margin-top:20px; background:var(--red); color:#fff !important; box-shadow:5px 5px 0 var(--ink); font-size:18px; font-weight:1000; }
    #yf-test .yf-primary:hover,#yf-test .yf-answer:hover,#yf-test .yf-secondary:hover { transform:translate(-2px,-2px); box-shadow:7px 7px 0 var(--ink); }
    #yf-test .yf-toolbar { display:flex; align-items:center; gap:9px; margin-bottom:15px; }
    #yf-test .yf-mini { min-height:38px; padding:7px 10px; border:2px solid var(--ink); background:var(--paper); color:var(--ink) !important; font-size:12px; font-weight:900; cursor:pointer; }
    #yf-test .yf-progress { flex:1; height:16px; border:2px solid var(--ink); background:#fff; overflow:hidden; }
    #yf-test .yf-progress span { display:block; width:5%; height:100%; background:var(--red); transition:width .25s ease; }
    #yf-test .yf-count { min-width:51px; text-align:right; font-size:13px; font-weight:1000; }
    #yf-test .yf-question-card { min-height:250px; padding:24px 20px; border:3px solid var(--ink); background:var(--paper); box-shadow:7px 7px 0 var(--navy); display:flex; flex-direction:column; justify-content:center; }
    #yf-test .yf-section { margin:0 0 8px; color:var(--red) !important; font-size:13px; font-weight:1000; letter-spacing:.08em; }
    #yf-test .yf-alert { display:none; align-self:flex-start; margin-bottom:12px; padding:5px 9px; border:2px solid var(--red); background:#fff0bd; color:#b22e20 !important; font-size:12px; font-weight:1000; transform:rotate(-1deg); }
    #yf-test .yf-alert.is-visible { display:block; }
    #yf-test .yf-question { margin:0; font-size:clamp(23px,5vw,34px); line-height:1.35; letter-spacing:-.035em; font-weight:1000; word-break:keep-all; }
    #yf-test .yf-answers { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:22px; }
    #yf-test .yf-answer { background:#fff; color:var(--ink) !important; font-weight:1000; box-shadow:4px 4px 0 var(--ink); }
    #yf-test .yf-answer[data-choice="yes"] { background:#ffd7cd; }
    #yf-test .yf-answer[data-choice="maybe"] { background:#fff0bd; }
    #yf-test .yf-answer[data-choice="no"] { background:#dcecff; }
    #yf-test .yf-result-head { text-align:center; }
    #yf-test .yf-level { display:inline-block; margin:0 auto 9px; padding:6px 13px; background:var(--ink); color:#fff !important; font-size:13px; font-weight:1000; }
    #yf-test .yf-result-title { margin:0 0 10px; color:var(--red) !important; font-size:clamp(29px,7vw,48px); line-height:1.12; letter-spacing:-.05em; font-weight:1000; word-break:keep-all; }
    #yf-test .yf-score { margin:0 0 18px; font-size:17px; font-weight:1000; }
    #yf-test .yf-result-copy { margin-top:22px; padding:20px; border:3px solid var(--ink); background:#fff; box-shadow:6px 6px 0 var(--gold); }
    #yf-test .yf-result-copy h3 { margin:0 0 8px; font-size:18px; font-weight:1000; }
    #yf-test .yf-result-copy p { margin:0 0 16px; font-size:15px; font-weight:650; word-break:keep-all; }
    #yf-test .yf-result-copy p:last-child { margin-bottom:0; }
    #yf-test .yf-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:22px; }
    #yf-test .yf-secondary { background:var(--paper); color:var(--ink) !important; box-shadow:4px 4px 0 var(--ink); font-weight:1000; }
    #yf-test .yf-toast { position:fixed; left:50%; bottom:125px; z-index:9999; transform:translateX(-50%) translateY(20px); max-width:calc(100vw - 32px); padding:11px 16px; border:2px solid var(--ink); background:var(--ink); color:#fff !important; font-size:13px; font-weight:900; opacity:0; pointer-events:none; transition:.2s ease; }
    #yf-test .yf-toast.is-visible { opacity:1; transform:translateX(-50%) translateY(0); }
    @keyframes yfIn { from { opacity:0; transform:translateY(9px); } to { opacity:1; transform:translateY(0); } }
    @media (max-width:560px) {
      #yf-test .yf-shell { min-height:620px; padding:15px 13px 130px; box-shadow:6px 6px 0 var(--ink); }
      #yf-test .yf-answers { grid-template-columns:1fr; }
      #yf-test .yf-answer { min-height:51px; }
      #yf-test .yf-question-card { min-height:235px; padding:21px 17px; }
      #yf-test .yf-actions { grid-template-columns:1fr; }
    }
    @media (prefers-reduced-motion:reduce) { #yf-test * { animation:none !important; transition:none !important; } }
  </style>

  <div class="yf-shell">

      <button class="yf-primary" id="yf-start-btn" type="button">테스트 시작</button>

    <section class="yf-screen" id="yf-quiz">
      <div class="yf-toolbar">
        <button class="yf-mini" id="yf-back" type="button">BACK</button>
